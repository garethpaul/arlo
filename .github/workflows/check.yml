name: check

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run SDK-free baseline
        run: make check

  native-policy:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run native policy tests
        run: scripts/test-wit-http-policy.sh

      - name: Compile maintained Wit sources
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun clang -fobjc-arc -fmodules -fsyntax-only \
            -target x86_64-apple-ios12.0-simulator \
            -isysroot "$SDK" -I Pods/Wit/Wit \
            Pods/Wit/Wit/WITHTTPPolicy.m \
            Pods/Wit/Wit/WITContextSetter.m \
            Pods/Wit/Wit/WITUploader.m \
            Pods/Wit/Wit/WITRecordingSession.m \
            Pods/Wit/Wit/Wit.m
